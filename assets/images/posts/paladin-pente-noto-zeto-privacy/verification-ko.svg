<svg xmlns="http://www.w3.org/2000/svg" width="560" height="842" viewBox="0 0 560 842" role="img" aria-labelledby="title desc" lang="ko">
<title id="title">비공개 데이터와 원장 검증</title>
<desc id="desc">Pente, Noto, Zeto의 비공개 데이터와 검증 주체를 공유 EVM 계약의 검사와 나란히 비교합니다. Besu 같은 공유 원장에서도 도메인별 검증 규칙은 유지되며, 최종 EVM 거래에서 결제 leg를 결합할 수 있습니다.</desc>
<style>
text{font-family:system-ui,sans-serif;font-size:22px;fill:#25323d}
.bg{fill:#fff}.rule{stroke:#d6dce1;stroke-width:1}.divider{stroke:#d6dce1;stroke-width:1;stroke-dasharray:3 5}
.title{font-size:24px;font-weight:600}.head{font-size:21px;fill:#53616c}.domain{font-size:23px;font-weight:600;fill:#35627a}.note{font-size:21px;fill:#53616c}
@media(prefers-color-scheme:dark){.bg{fill:#171c22}text{fill:#e2e7ec}.rule,.divider{stroke:#45515c}.head,.note{fill:#bac4ce}.domain{fill:#91b9ce}}
</style>
<rect width="560" height="842" class="bg"/>
<text x="20" y="36" class="title">비공개 데이터와 원장 검증</text>
<text x="20" y="78" class="head">비공개 데이터·검증</text>
<text x="298" y="78" class="head">공유 EVM 계약의 검사</text>
<path d="M20 94H540 M280 110V728" class="divider" fill="none"/>
<text x="20" y="128" class="domain">Pente</text>
<text x="20" y="164">EVM 계정·storage</text>
<text x="20" y="192">nonce·실행 입력</text>
<text x="20" y="220">그룹 멤버가 보관·재실행</text>
<text x="298" y="164">endorsement 서명</text>
<text x="298" y="192">+ 상태 ID</text>
<text x="298" y="220">inputs 소비</text>
<text x="298" y="248">reads 유효성 확인</text>
<path d="M20 292H540" class="rule" fill="none"/>
<text x="20" y="328" class="domain">Noto</text>
<text x="20" y="364">owner·amount·salt</text>
<text x="20" y="392">notary·지정 당사자 열람</text>
<text x="20" y="420">notary가 값 보존 검사</text>
<text x="298" y="364">notary / spender 권한</text>
<text x="298" y="392">+ 상태 ID</text>
<text x="298" y="420">입력 미소비 확인</text>
<text x="298" y="448">상태 소비</text>
<path d="M20 492H540" class="rule" fill="none"/>
<text x="20" y="528" class="domain">Zeto</text>
<text x="20" y="564">증명 생성자: 비밀키</text>
<text x="20" y="592">+ witness</text>
<text x="20" y="620">수취자: 자기 출력</text>
<text x="20" y="648">opening</text>
<text x="298" y="564">verifier: proof</text>
<text x="298" y="592">+ 공개 입력</text>
<text x="298" y="620">계약: 소비 규칙</text>
<text x="298" y="648">nullifier 변형:</text>
<text x="298" y="676">Merkle 포함 검사</text>
<path d="M20 692H540" class="rule" fill="none"/>
<text x="20" y="762" class="note">Besu 같은 하나의 공유 원장</text>
<text x="20" y="790" class="note">도메인별 검증 규칙 유지</text>
<text x="20" y="818" class="note">최종 EVM 거래에서 결제 leg 결합 가능</text>
</svg>
