<svg xmlns="http://www.w3.org/2000/svg" width="560" height="842" viewBox="0 0 560 842" role="img" aria-labelledby="title desc" lang="en">
<title id="title">Private data and ledger checks</title>
<desc id="desc">Pente, Noto and Zeto private data and validation roles are compared alongside shared EVM contract checks. Each domain retains its validation rules on a shared ledger such as Besu; settlement legs can join one final EVM transaction.</desc>
<style>
text{font-family:system-ui,sans-serif;font-size:22px;fill:#25323d}
.bg{fill:#fff}.rule{stroke:#d6dce1;stroke-width:1}.divider{stroke:#d6dce1;stroke-width:1;stroke-dasharray:3 5}
.title{font-size:24px;font-weight:600}.head{font-size:21px;fill:#53616c}.domain{font-size:23px;font-weight:600;fill:#35627a}.note{font-size:21px;fill:#53616c}
@media(prefers-color-scheme:dark){.bg{fill:#171c22}text{fill:#e2e7ec}.rule,.divider{stroke:#45515c}.head,.note{fill:#bac4ce}.domain{fill:#91b9ce}}
</style>
<rect width="560" height="842" class="bg"/>
<text x="20" y="36" class="title">Private data and ledger checks</text>
<text x="20" y="78" class="head">Private data &amp; roles</text>
<text x="298" y="78" class="head">EVM contract checks</text>
<path d="M20 94H540 M280 110V728" class="divider" fill="none"/>
<text x="20" y="128" class="domain">Pente</text>
<text x="20" y="164">EVM accounts</text>
<text x="20" y="192">storage, nonce</text>
<text x="20" y="220">Execution input</text>
<text x="20" y="248">Group members store</text>
<text x="20" y="276">data and re-execute</text>
<text x="298" y="164">Endorsement</text>
<text x="298" y="192">signatures, state IDs</text>
<text x="298" y="220">Consume inputs;</text>
<text x="298" y="248">check read states</text>
<path d="M20 292H540" class="rule" fill="none"/>
<text x="20" y="328" class="domain">Noto</text>
<text x="20" y="364">Owner, amount, salt</text>
<text x="20" y="392">Notary + designated</text>
<text x="20" y="420">parties see data</text>
<text x="20" y="448">Notary checks</text>
<text x="20" y="476">value conservation</text>
<text x="298" y="364">Notary / spender</text>
<text x="298" y="392">authority + state IDs</text>
<text x="298" y="420">Check inputs unspent</text>
<text x="298" y="448">consume states</text>
<path d="M20 492H540" class="rule" fill="none"/>
<text x="20" y="528" class="domain">Zeto</text>
<text x="20" y="564">Prover: private key</text>
<text x="20" y="592">+ witness</text>
<text x="20" y="620">Recipient: own output</text>
<text x="20" y="648">opening</text>
<text x="298" y="564">Verifier: proof +</text>
<text x="298" y="592">public inputs</text>
<text x="298" y="620">Contract: spend rules</text>
<text x="298" y="648">Nullifier variant:</text>
<text x="298" y="676">Merkle membership</text>
<path d="M20 692H540" class="rule" fill="none"/>
<text x="20" y="762" class="note">One shared ledger (e.g. Besu).</text>
<text x="20" y="790" class="note">Each domain keeps its validation rules.</text>
<text x="20" y="818" class="note">Settlement legs can join one final EVM tx.</text>
</svg>
