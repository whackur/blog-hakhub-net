<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1120" viewBox="0 0 960 1120" role="img" aria-labelledby="title desc">
  <title id="title">Avalanche: shared and independent validator sets</title>
  <desc id="desc">The Primary Network contains P, C and X chains secured by the same validator set. Custom L1 A and L1 B have separate validators. A dashed registry relationship links them to the P-Chain. ICM messages travel between the L1s without passing through the P-Chain.</desc>
  <rect width="960" height="1120" fill="#f8fafc"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#0f172a">
    <text x="48" y="61" font-size="36" font-weight="700">Avalanche network structure</text>
    <rect x="40" y="94" width="880" height="395" rx="24" fill="#e8eefb" stroke="#284b8b" stroke-width="3"/>
    <text x="72" y="142" font-size="32" font-weight="700">Primary Network</text>
    <text x="72" y="181" font-size="28">One validator set secures all three chains</text>
    <rect x="72" y="215" width="816" height="78" rx="12" fill="#fff" stroke="#284b8b" stroke-width="2"/>
    <text x="94" y="265" font-size="30" font-weight="700">P-Chain</text>
    <text x="295" y="265" font-size="28">Staking + validator registry</text>
    <rect x="72" y="305" width="816" height="70" rx="12" fill="#fff"/>
    <text x="94" y="350" font-size="30" font-weight="700">C-Chain</text>
    <text x="295" y="350" font-size="28">EVM smart contracts</text>
    <rect x="72" y="387" width="816" height="70" rx="12" fill="#fff"/>
    <text x="94" y="432" font-size="30" font-weight="700">X-Chain</text>
    <text x="295" y="432" font-size="28">Native assets (linear chain)</text>
    <path d="M888 254 H936 V586 H246 V630 M246 586 H714 V630" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="10 8"/>
    <rect x="95" y="512" width="770" height="53" rx="10" fill="#f8fafc"/>
    <text x="480" y="548" text-anchor="middle" font-size="27" fill="#475569">Dashed: P-Chain registration / validator information</text>
    <rect x="40" y="630" width="412" height="250" rx="22" fill="#e5f5ee" stroke="#21634c" stroke-width="3"/>
    <text x="70" y="681" font-size="32" font-weight="700">Custom L1 A</text>
    <text x="70" y="729" font-size="28">Own validators</text>
    <text x="70" y="774" font-size="28">Own VM + gas rules</text>
    <text x="70" y="839" font-size="26" fill="#21634c">Security boundary A</text>
    <rect x="508" y="630" width="412" height="250" rx="22" fill="#fff1df" stroke="#86501a" stroke-width="3"/>
    <text x="538" y="681" font-size="32" font-weight="700">Custom L1 B</text>
    <text x="538" y="729" font-size="28">Own validators</text>
    <text x="538" y="774" font-size="28">Own VM + gas rules</text>
    <text x="538" y="839" font-size="26" fill="#86501a">Security boundary B</text>
    <path d="M246 880 V938 H714 V880" fill="none" stroke="#334155" stroke-width="3"/>
    <text x="480" y="980" text-anchor="middle" font-size="29" font-weight="700">ICM messages + relayer</text>
    <text x="480" y="1030" text-anchor="middle" font-size="28">Source signatures → destination verification</text>
    <text x="480" y="1080" text-anchor="middle" font-size="28">Registration does not share validator security</text>
  </g>
</svg>
