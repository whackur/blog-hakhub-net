<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 1690" role="img" aria-labelledby="title desc">
  <title id="title">Thinking block and alleged replay</title>
  <desc id="desc">The diagram separates ordinary continuation in the same conversation from Anthropic's allegation that a saved thinking signature was replayed in a changed context and Claude was prompted to reproduce its reasoning. Reported mitigations appear in a separate panel. The exact requests are not disclosed.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M1 1 L10 6 L1 11 Z" fill="#334155"/>
    </marker>
  </defs>
  <rect width="760" height="1690" fill="#F8FAFC"/>
  <text x="48" y="58" fill="#102A43" font-family="Arial, Helvetica, sans-serif" font-size="32" font-weight="700">Thinking block replay</text>
  <text x="48" y="98" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="22">Anthropic's account · conceptual, not a full exploit recipe</text>

  <rect x="48" y="128" width="664" height="68" rx="14" fill="#FFF7ED" stroke="#C2410C" stroke-width="2"/>
  <text x="72" y="171" fill="#7C2D12" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Report claim; exact steps not disclosed</text>

  <rect x="60" y="230" width="640" height="208" rx="20" fill="#EDE9FE" stroke="#6D28D9" stroke-width="3"/>
  <text x="88" y="278" fill="#4C1D95" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Original Claude response</text>
  <text x="88" y="327" fill="#102A43" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Thinking block</text>
  <text x="88" y="364" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="22">May be summarized or omitted</text>
  <text x="88" y="407" fill="#102A43" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Signature</text>
  <text x="260" y="407" fill="#334155" font-family="Arial, Helvetica, sans-serif" font-size="22">Opaque value, not reasoning text</text>

  <line x1="380" y1="439" x2="380" y2="475" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="48" y="518" fill="#075985" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Normal API continuation</text>
  <rect x="60" y="540" width="640" height="140" rx="20" fill="#CCFBF1" stroke="#0F766E" stroke-width="3"/>
  <text x="88" y="589" fill="#134E4A" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Same conversation, unchanged block</text>
  <text x="88" y="629" fill="#102A43" font-family="Arial, Helvetica, sans-serif" font-size="22">Pass the prior block back as received;</text>
  <text x="88" y="660" fill="#102A43" font-family="Arial, Helvetica, sans-serif" font-size="22">Claude continues the conversation.</text>

  <line x1="60" y1="719" x2="700" y2="719" stroke="#94A3B8" stroke-width="2" stroke-dasharray="8 8"/>
  <text x="48" y="765" fill="#9A3412" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Cross-session replay alleged by Anthropic</text>

  <rect x="60" y="793" width="640" height="120" rx="20" fill="#FEF3C7" stroke="#A16207" stroke-width="3"/>
  <text x="88" y="839" fill="#713F12" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">1. Retain the exchange and signature</text>
  <text x="88" y="881" fill="#102A43" font-family="Arial, Helvetica, sans-serif" font-size="22">Opaque signature; not readable reasoning.</text>

  <line x1="380" y1="914" x2="380" y2="949" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="60" y="961" width="640" height="130" rx="20" fill="#FEF3C7" stroke="#A16207" stroke-width="3"/>
  <text x="88" y="1007" fill="#713F12" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">2. Replay signature in a new session</text>
  <text x="88" y="1048" fill="#102A43" font-family="Arial, Helvetica, sans-serif" font-size="22">Context changes are reconstructed, not disclosed.</text>

  <line x1="380" y1="1092" x2="380" y2="1127" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="60" y="1139" width="640" height="130" rx="20" fill="#FEF3C7" stroke="#A16207" stroke-width="3"/>
  <text x="88" y="1185" fill="#713F12" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">3. Prompt Claude to reproduce the trace</text>
  <text x="88" y="1226" fill="#102A43" font-family="Arial, Helvetica, sans-serif" font-size="22">Reported elicitation; prompts not disclosed.</text>

  <line x1="380" y1="1270" x2="380" y2="1305" stroke="#334155" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="60" y="1317" width="640" height="108" rx="20" fill="#FCE7F3" stroke="#BE185D" stroke-width="3"/>
  <text x="88" y="1362" fill="#831843" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Full reasoning transcript harvested</text>
  <text x="88" y="1402" fill="#102A43" font-family="Arial, Helvetica, sans-serif" font-size="22">Claimed outcome; exact method is not public.</text>

  <rect x="48" y="1460" width="664" height="194" rx="20" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="3"/>
  <text x="76" y="1507" fill="#1E3A8A" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700">Reported mitigations</text>
  <text x="76" y="1550" fill="#102A43" font-family="Arial, Helvetica, sans-serif" font-size="22">• Summarize reasoning before the response</text>
  <text x="76" y="1585" fill="#102A43" font-family="Arial, Helvetica, sans-serif" font-size="22">• Preserve prior context (Fable 5.1, new accounts)</text>
  <text x="76" y="1620" fill="#102A43" font-family="Arial, Helvetica, sans-serif" font-size="22">• Strengthen classifiers and account enforcement</text>
</svg>
