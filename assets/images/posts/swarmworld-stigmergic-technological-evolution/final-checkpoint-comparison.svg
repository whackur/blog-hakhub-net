<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" role="img" aria-labelledby="figTitle figDesc" font-family="Arial, Helvetica, sans-serif">
  <title id="figTitle">SwarmWorld final checkpoint: three conditions compared on portfolio resilience and validated inventions</title>
  <desc id="figDesc">Two bar charts from the SwarmWorld long-horizon study at tick 3,200 with 100 agents. Left panel, portfolio resilience on a 0 to 0.30 scale: full culture 0.2474, no explicit culture 0.2365, isolated search 0.1794. Right panel, validated invention count on a 0 to 8 scale: full culture 5.75, no explicit culture 7.00, isolated search 2.75. A callout below states that the strongest single artifact at tick 3,200 was 0.3488 under isolated search versus 0.2380 under full culture. Source: arXiv 2608.26081.</desc>

  <style>
    @media (prefers-color-scheme: dark) {
      rect[fill="#F7F7F5"] { fill:#0F172A; }
      rect[stroke="#E2E2DE"] { stroke:#1E293B; }
      rect[fill="#FFFFFF"] { fill:#111827; }
      rect[stroke="#E5E7EB"] { stroke:#1E293B; }
      line[stroke="#E5E7EB"] { stroke:#1E293B; }
      g[stroke="#EDEDEC"] { stroke:#1E293B; }
      text[fill="#1F2430"] { fill:#F1F5F9; }
      text[fill="#5B6472"] { fill:#CBD5E1; }
      text[fill="#4B5563"] { fill:#CBD5E1; }
      text[fill="#6B7280"] { fill:#94A3B8; }
      text[fill="#374151"] { fill:#E2E8F0; }
      text[fill="#8A8F98"] { fill:#94A3B8; }
      text[fill="#B8790A"] { fill:#FBBF24; }
      rect[fill="#E69F00"][fill-opacity="0.10"] { fill-opacity:0.24; }
    }
  </style>

  <rect x="0" y="0" width="980" height="620" rx="16" fill="#F7F7F5" stroke="#E2E2DE" stroke-width="1"/>

  <text x="40" y="42" font-size="28" font-weight="bold" fill="#1F2430">SwarmWorld: final checkpoint, tick 3,200</text>
  <text x="40" y="68" font-size="18" fill="#5B6472">N = 100 agents, long-horizon study, three conditions</text>

  <!-- ============ PANEL A: portfolio resilience ============ -->
  <rect x="20" y="86" width="460" height="380" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="40" y="118" font-size="21" font-weight="bold" fill="#1F2430">Portfolio resilience</text>
  <text x="40" y="140" font-size="16" fill="#6B7280">index, mean per condition (higher is better)</text>

  <g stroke="#EDEDEC" stroke-width="1">
    <line x1="90" y1="330" x2="450" y2="330"/>
    <line x1="90" y1="240" x2="450" y2="240"/>
    <line x1="90" y1="150" x2="450" y2="150"/>
  </g>

  <line x1="90" y1="150" x2="90" y2="420" stroke="#9CA3AF" stroke-width="1"/>
  <line x1="90" y1="420" x2="450" y2="420" stroke="#9CA3AF" stroke-width="1"/>

  <g font-size="16" fill="#6B7280" text-anchor="end">
    <text x="82" y="426">0</text>
    <text x="82" y="336">0.10</text>
    <text x="82" y="246">0.20</text>
    <text x="82" y="156">0.30</text>
  </g>

  <rect x="120" y="197.3" width="80" height="222.7" fill="#0072B2"/>
  <text x="160" y="187" font-size="23" font-weight="bold" fill="#0072B2" text-anchor="middle">0.2474</text>

  <rect x="240" y="207.1" width="80" height="212.9" fill="#009E73"/>
  <text x="280" y="197" font-size="23" font-weight="bold" fill="#009E73" text-anchor="middle">0.2365</text>

  <rect x="360" y="258.5" width="80" height="161.5" fill="#E69F00"/>
  <text x="400" y="248" font-size="23" font-weight="bold" fill="#B8790A" text-anchor="middle">0.1794</text>

  <g font-size="16" font-weight="bold" text-anchor="middle">
    <text x="160" y="442" fill="#0072B2">Full</text>
    <text x="160" y="460" fill="#0072B2">culture</text>
    <text x="280" y="442" fill="#009E73">No explicit</text>
    <text x="280" y="460" fill="#009E73">culture</text>
    <text x="400" y="442" fill="#B8790A">Isolated</text>
    <text x="400" y="460" fill="#B8790A">search</text>
  </g>

  <!-- ============ PANEL B: validated inventions ============ -->
  <rect x="500" y="86" width="460" height="380" rx="10" fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <text x="520" y="118" font-size="21" font-weight="bold" fill="#1F2430">Validated inventions</text>
  <text x="520" y="140" font-size="16" fill="#6B7280">mean count per episode (higher is better)</text>

  <g stroke="#EDEDEC" stroke-width="1">
    <line x1="570" y1="352.5" x2="930" y2="352.5"/>
    <line x1="570" y1="285" x2="930" y2="285"/>
    <line x1="570" y1="217.5" x2="930" y2="217.5"/>
    <line x1="570" y1="150" x2="930" y2="150"/>
  </g>

  <line x1="570" y1="150" x2="570" y2="420" stroke="#9CA3AF" stroke-width="1"/>
  <line x1="570" y1="420" x2="930" y2="420" stroke="#9CA3AF" stroke-width="1"/>

  <g font-size="16" fill="#6B7280" text-anchor="end">
    <text x="562" y="426">0</text>
    <text x="562" y="358.5">2</text>
    <text x="562" y="291">4</text>
    <text x="562" y="223.5">6</text>
    <text x="562" y="156">8</text>
  </g>

  <rect x="600" y="225.94" width="80" height="194.06" fill="#0072B2"/>
  <text x="640" y="215" font-size="23" font-weight="bold" fill="#0072B2" text-anchor="middle">5.75</text>

  <rect x="720" y="183.75" width="80" height="236.25" fill="#009E73"/>
  <text x="760" y="173" font-size="23" font-weight="bold" fill="#009E73" text-anchor="middle">7.00</text>

  <rect x="840" y="327.19" width="80" height="92.81" fill="#E69F00"/>
  <text x="880" y="317" font-size="23" font-weight="bold" fill="#B8790A" text-anchor="middle">2.75</text>

  <g font-size="16" font-weight="bold" text-anchor="middle">
    <text x="640" y="442" fill="#0072B2">Full</text>
    <text x="640" y="460" fill="#0072B2">culture</text>
    <text x="760" y="442" fill="#009E73">No explicit</text>
    <text x="760" y="460" fill="#009E73">culture</text>
    <text x="880" y="442" fill="#B8790A">Isolated</text>
    <text x="880" y="460" fill="#B8790A">search</text>
  </g>

  <!-- ============ CALLOUT ============ -->
  <rect x="20" y="484" width="940" height="72" rx="10" fill="#E69F00" fill-opacity="0.10" stroke="#B8790A" stroke-opacity="0.35" stroke-width="1"/>
  <rect x="20" y="484" width="5" height="72" fill="#E69F00"/>
  <text x="44" y="514" font-size="20" font-weight="bold" fill="#374151">Strongest single artifact at tick 3,200: isolated search 0.3488 vs. full culture 0.2380</text>
  <text x="44" y="542" font-size="17" fill="#4B5563">Separate scales in the two panels above. Values are not comparable across panels.</text>

  <line x1="20" y1="578" x2="960" y2="578" stroke="#E5E7EB" stroke-width="1"/>
  <text x="40" y="600" font-size="16" fill="#8A8F98">Rebuilt from values reported in arXiv:2608.26081 (SwarmWorld), long-horizon study, N=100, tick 3,200. Accessed 2026-08-30.</text>
</svg>
